kind = "mobile"
previewPath = "/mv-ai-mobile"
title = "MV AI Mobile"
version = "1.0.0"
id = "artifacts/mv-ai-mobile"
router = "path"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mv-ai-mobile" ]
localPort = 21191

[services.development]
run = "pnpm --filter @workspace/mv-ai-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mv-ai-mobile", "run", "build" ]
run = "pnpm --filter @workspace/mv-ai-mobile run serve"

[services.env]
PORT = "21191"
BASE_PATH = "/mv-ai-mobile"
